
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="Random Password Generator.css">
</head>
<body>

    <div class="container">
        <h1>Password Generator 🔐</h1>
        <p class="subtitle">Create a strong and secure password</p>

        <div class="password-box">
            <input
                type="text"
                id="password"
                placeholder="Your password appears here"
                readonly
            >
            <button id="copyBtn">Copy</button>
        </div>

        <div class="length-section">
            <label for="length">
                Password Length: <span id="lengthValue">12</span>
            </label>
            <input type="range" id="length" min="4" max="32" value="12">
        </div>

        <div class="options">
            <label>
                <input type="checkbox" id="uppercase" checked>
                Uppercase (A-Z)
            </label>

            <label>
                <input type="checkbox" id="lowercase" checked>
                Lowercase (a-z)
            </label>

            <label>
                <input type="checkbox" id="numbers" checked>
                Numbers (0-9)
            </label>

            <label>
                <input type="checkbox" id="symbols" checked>
                Symbols (!@#$)
            </label>
        </div>

        <button id="generateBtn" class="generate-btn">
            Generate Password
        </button>

        <p id="message" aria-live="polite"></p>
    </div>

    <script src="Random Password Generator.js"></script>
</body>
</html>
